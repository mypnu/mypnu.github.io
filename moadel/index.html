<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>محاسبه معدل | My Pnu</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #090d16;
      --glass-bg: rgba(17, 25, 40, 0.72);
      --glass-border: rgba(255, 255, 255, 0.09);
      --neon-blue: #00d2ff;
      --neon-green: #00ff88;
      --neon-red: #ff3b5c;
      --neon-gold: #ffb800;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 210, 255, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(0, 255, 136, 0.06) 0%, transparent 45%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 14px 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 640px;
    }

    /* هدر صفحه */
    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .header h1 {
      font-size: 1.45rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 0 18px rgba(0, 210, 255, 0.45);
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* باکس اصلی شیشه‌ای */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 210, 255, 0.35);
      box-shadow: 0 0 22px rgba(0, 210, 255, 0.1), inset 0 0 12px rgba(0, 210, 255, 0.04);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 18px;
    }

    /* هدر ستون‌ها */
    .columns-header {
      display: grid;
      grid-template-columns: 1fr 78px 86px 42px;
      gap: 8px;
      padding: 0 6px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--neon-blue);
      text-align: center;
    }

    .columns-header span:first-child {
      text-align: right;
      padding-right: 6px;
    }

    /* ردیف‌های درس */
    .courses-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .course-row {
      display: grid;
      grid-template-columns: 1fr 78px 86px 42px;
      gap: 8px;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 8px;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .course-row:focus-within {
      border-color: rgba(0, 210, 255, 0.5);
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.12);
    }

    .course-row.row-error {
      border-color: var(--neon-red);
      box-shadow: 0 0 14px rgba(255, 59, 92, 0.25);
    }

    .course-row input {
      width: 100%;
      height: 42px;
      background: rgba(9, 13, 22, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: #fff;
      font-size: 0.9rem;
      padding: 0 10px;
      outline: none;
      transition: all 0.2s ease;
    }

    .course-row input::placeholder {
      color: #64748b;
      font-size: 0.8rem;
    }

    .course-row input:focus {
      border-color: var(--neon-blue);
    }

    .course-row input.num-input {
      text-align: center;
      font-weight: 600;
      direction: ltr;
    }

    /* دکمه حذف مربعی */
    .btn-delete {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(255, 59, 92, 0.1);
      border: 1px solid rgba(255, 59, 92, 0.45);
      color: var(--neon-red);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .btn-delete:hover {
      background: rgba(255, 59, 92, 0.22);
      box-shadow: 0 0 12px rgba(255, 59, 92, 0.35);
      transform: scale(1.03);
    }

    .btn-delete svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
    }

    /* باکس هشدار جذاب درون صفحه (بدون پاپ‌آپ) */
    .inline-alert {
      display: none;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255, 59, 92, 0.12);
      border: 1px solid rgba(255, 59, 92, 0.65);
      box-shadow: 0 0 18px rgba(255, 59, 92, 0.2), inset 0 0 10px rgba(255, 59, 92, 0.08);
      color: #ffd6de;
      font-size: 0.86rem;
      line-height: 1.6;
      animation: slideFade 0.28s ease;
    }

    .inline-alert.show {
      display: flex;
    }

    .alert-icon-box {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(255, 59, 92, 0.2);
      border: 1px solid var(--neon-red);
      color: var(--neon-red);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 10px rgba(255, 59, 92, 0.3);
    }

    .alert-icon-box svg {
      width: 21px;
      height: 21px;
    }

    @keyframes slideFade {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* دکمه‌های عملیاتی */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      height: 46px;
      border-radius: 13px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.22s ease;
      background: rgba(255, 255, 255, 0.04);
    }

    .btn-add {
      border: 1px solid rgba(0, 210, 255, 0.55);
      color: var(--neon-blue);
      box-shadow: 0 0 14px rgba(0, 210, 255, 0.12);
    }

    .btn-add:hover {
      background: rgba(0, 210, 255, 0.14);
      box-shadow: 0 0 18px rgba(0, 210, 255, 0.28);
    }

    .btn-calc {
      border: 1px solid rgba(0, 255, 136, 0.65);
      color: var(--neon-green);
      background: rgba(0, 255, 136, 0.1);
      box-shadow: 0 0 16px rgba(0, 255, 136, 0.18);
    }

    .btn-calc:hover {
      background: rgba(0, 255, 136, 0.2);
      box-shadow: 0 0 22px rgba(0, 255, 136, 0.35);
    }

    /* کارت نتیجه معدل */
    .result-card {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 255, 136, 0.45);
      box-shadow: 0 0 24px rgba(0, 255, 136, 0.12);
      border-radius: 20px;
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      text-align: center;
    }

    .stat-box {
      background: rgba(9, 13, 22, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px 10px;
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--neon-green);
      text-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
      direction: ltr;
    }

    .stat-box.units .stat-value {
      color: var(--neon-gold);
      text-shadow: 0 0 15px rgba(255, 184, 0, 0.35);
    }

    .footer-sign {
      margin-top: 24px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .footer-sign span {
      color: var(--neon-blue);
      font-weight: 700;
    }

    @media (max-width: 440px) {
      .columns-header,
      .course-row {
        grid-template-columns: 1fr 68px 74px 40px;
        gap: 6px;
      }
      .course-row {
        padding: 7px;
      }
      .btn-delete {
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>محاسبه معدل ترم | My Pnu</h1>
      <p>نام دروس، تعداد واحد و نمرات خود را وارد کنید</p>
    </div>

    <div class="glass-card">
      <div class="columns-header">
        <span>نام درس</span>
        <span>واحد</span>
        <span>نمره</span>
        <span>حذف</span>
      </div>

      <div class="courses-list" id="coursesList"></div>

      <!-- باکس هشدار درون‌صفحه‌ای (بدون پاپ‌آپ) -->
      <div class="inline-alert" id="alertBox" role="alert">
        <div class="alert-icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </div>
        <div id="alertText"></div>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-add" onclick="addCourseRow()">
          <span>+ افزودن درس</span>
        </button>
        <button type="button" class="btn btn-calc" onclick="calculateGPA()">
          <span>محاسبه معدل</span>
        </button>
      </div>
    </div>

    <div class="result-card">
      <div class="stat-box">
        <div class="stat-label">معدل کل</div>
        <div class="stat-value" id="gpaDisplay">0.00</div>
      </div>
      <div class="stat-box units">
        <div class="stat-label">مجموع واحدها</div>
        <div class="stat-value" id="unitsDisplay">0</div>
      </div>
    </div>

    <div class="footer-sign">
      <span>My Pnu</span> • طراحی شده توسط <span>ARMOON</span>
    </div>
  </div>

  <script>
    const coursesList = document.getElementById('coursesList');
    const alertBox = document.getElementById('alertBox');
    const alertText = document.getElementById('alertText');

    // تبدیل اعداد فارسی و عربی به انگلیسی
    function toEnglishDigits(str) {
      return str
        .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
        .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
    }

    function showAlert(message) {
      alertText.textContent = message;
      alertBox.classList.add('show');
    }

    function hideAlert() {
      alertBox.classList.remove('show');
    }

    function addCourseRow(name = '', unit = '', grade = '') {
      const row = document.createElement('div');
      row.className = 'course-row';

      row.innerHTML = `
        <input type="text" class="course-name" placeholder="مثلاً: اصول حسابداری ۱" value="${name}" />
        <input type="text" inputmode="numeric" class="num-input course-unit" placeholder="۱ تا ۴" value="${unit}" />
        <input type="text" inputmode="decimal" class="num-input course-grade" placeholder="۰ تا ۲۰" value="${grade}" />
        <button type="button" class="btn-delete" title="حذف درس" onclick="removeCourseRow(this)">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>
        </button>
      `;

      // پاک شدن حالت خطا هنگام تایپ مجدد
      row.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('input', () => {
          row.classList.remove('row-error');
          hideAlert();
        });
      });

      coursesList.appendChild(row);
    }

    function removeCourseRow(btn) {
      const rows = coursesList.querySelectorAll('.course-row');
      if (rows.length <= 1) {
        showAlert('حداقل یک ردیف درس باید در جدول باقی بماند.');
        return;
      }
      btn.closest('.course-row').remove();
      hideAlert();
    }

    // انیمیشن شمارنده عددی
    function animateCounter(element, target, decimals = 2) {
      const duration = 600;
      const start = parseFloat(element.textContent) || 0;
      const startTime = performance.now();

      function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 3);
        const current = start + (target - start) * ease;
        element.textContent = current.toFixed(decimals);

        if (progress < 1) {
          requestAnimationFrame(update);
        } else {
          element.textContent = target.toFixed(decimals);
        }
      }

      requestAnimationFrame(update);
    }

    function calculateGPA() {
      hideAlert();
      const rows = coursesList.querySelectorAll('.course-row');
      rows.forEach(r => r.classList.remove('row-error'));

      let totalPoints = 0;
      let totalUnits = 0;
      let filledRows = 0;

      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const nameVal = row.querySelector('.course-name').value.trim();
        const unitRaw = toEnglishDigits(row.querySelector('.course-unit').value.trim());
        const gradeRaw = toEnglishDigits(row.querySelector('.course-grade').value.trim().replace('/', '.'));

        // نادیده گرفتن ردیف‌های کاملاً خالی
        if (!nameVal && !unitRaw && !gradeRaw) {
          continue;
        }

        filledRows++;
        const courseLabel = nameVal ? `درس «${nameVal}»` : `ردیف ${i + 1}`;

        // بررسی تعداد واحد (باید عدد صحیح بین ۱ تا ۴ باشد)
        const unitNum = Number(unitRaw);
        if (!unitRaw || isNaN(unitNum) || !Number.isInteger(unitNum) || unitNum < 1 || unitNum > 4) {
          row.classList.add('row-error');
          showAlert(`تعداد واحد در ${courseLabel} نامعتبر است! تعداد واحد باید عددی بین ۱ تا ۴ باشد.`);
          return;
        }

        // بررسی نمره (باید بین ۰ تا ۲۰ باشد)
        const gradeNum = Number(gradeRaw);
        if (gradeRaw === '' || isNaN(gradeNum) || gradeNum < 0 || gradeNum > 20) {
          row.classList.add('row-error');
          showAlert(`نمره وارد شده در ${courseLabel} مجاز نیست! نمره باید بین ۰ تا ۲۰ باشد.`);
          return;
        }

        totalUnits += unitNum;
        totalPoints += unitNum * gradeNum;
      }

      if (filledRows === 0) {
        showAlert('لطفاً حداقل برای یک درس، تعداد واحد و نمره را وارد کنید.');
        return;
      }

      const gpa = totalPoints / totalUnits;
      animateCounter(document.getElementById('gpaDisplay'), gpa, 2);
      animateCounter(document.getElementById('unitsDisplay'), totalUnits, 0);
    }

    // ایجاد ۴ ردیف پیش‌فرض هنگام باز شدن صفحه
    for (let i = 0; i < 4; i++) {
      addCourseRow();
    }
  </script>
</body>
</html>
